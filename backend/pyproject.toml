[project]
name = "starlocator"
version = "2.1.0"
description = "照片测星定位 网页app（地平论吧）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astronomy-engine>=2.1.19",
    "astropy>=8.0.1",
    "async-lru>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sep>=1.4.1",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.4",
]

[tool.ruff]
target-version = "py312"
exclude = [
    # vendored from https://github.com/dstndstn/astrometry.net
    "core/astrometry/client.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # 本项目为中文注释/星表数据：全角标点与希腊字母（星名）为有意使用
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
# 显式声明本地模块：避免因 config.py（gitignored）缺失导致一方/第三方分类漂移
known-first-party = ["config", "core", "main", "routers", "schemas", "tests"]

[tool.pytest.ini_options]
filterwarnings = [
    # async-lru 检测到测试中事件循环切换并自动清理缓存，库文档声明该行为安全
    "ignore:alru_cache detected event loop change",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.0.3",
]
